<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#4a90d9"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#39b54a"/></marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#e8873a"/></marker>
    <style>
      .bx{fill:#fff;stroke:#4a5568;stroke-width:2;rx:8}
      .ps{fill:#e8f0fb;stroke:#4a90d9;stroke-width:2.5;rx:10}
      .pl{fill:#eaf7ec;stroke:#39b54a;stroke-width:2.5;rx:10}
      .ex{fill:#fdf3e7;stroke:#e8873a;stroke-width:2;rx:8}
      .bc{fill:#fff3e0;stroke:#e8873a;stroke-width:3;rx:10}
      .t{font-size:21px;font-weight:bold;fill:#2d3748}
      .h{font-size:15px;font-weight:bold;fill:#2d3748}
      .s{font-size:12px;fill:#4a5568}
      .m{font-family:DejaVu Sans Mono,monospace;font-size:11px;fill:#2d3748}
      .k{font-size:12px;font-weight:bold;fill:#c0392b}
    </style>
  </defs>
  <rect width="1240" height="860" fill="#f7f9fc"/>
  <text x="620" y="32" text-anchor="middle" class="t">XJSM-P12-Z7000 — System Block Diagram (Broadcast + 12-Engine Version)</text>
  <text x="620" y="54" text-anchor="middle" class="s">Zynq XC7Z020 · 12 channels + 1 broadcast engine · XVC over Ethernet · Vivado/PetaLinux 2023.1</text>

  <!-- Host -->
  <rect x="30" y="88" width="210" height="120" class="bx"/>
  <text x="135" y="114" text-anchor="middle" class="h">Host PC</text>
  <text x="135" y="136" text-anchor="middle" class="s">Vivado 2023.1 / xsdb</text>
  <text x="135" y="156" text-anchor="middle" class="m">192.168.1.50</text>
  <text x="135" y="178" text-anchor="middle" class="s">open_hw_target</text>
  <text x="135" y="196" text-anchor="middle" class="s">-xvc_url</text>

  <line x1="240" y1="148" x2="330" y2="148" stroke="#4a90d9" stroke-width="3" marker-end="url(#a)"/>
  <text x="285" y="138" text-anchor="middle" class="s">Ethernet</text>
  <text x="285" y="168" text-anchor="middle" class="m">2542+2543-2554</text>

  <!-- PS -->
  <rect x="330" y="70" width="340" height="156" class="ps"/>
  <text x="500" y="96" text-anchor="middle" class="h">Zynq PS — Cortex-A9</text>
  <text x="500" y="118" text-anchor="middle" class="s">Linux 6.1.5 · eth0 · custom rootfs</text>
  <text x="346" y="145" class="m">xvcserver_g1</text>
  <text x="346" y="163" class="s">13 listening sockets</text>
  <text x="346" y="182" class="s">fork() one process per client</text>
  <text x="346" y="201" class="s">broadcast priority: kill_other_clients()</text>
  <text x="346" y="220" class="m">xvcweb (httpd :80 + CGI)</text>

  <line x1="670" y1="148" x2="750" y2="148" stroke="#4a90d9" stroke-width="3" marker-end="url(#a)"/>
  <text x="710" y="138" text-anchor="middle" class="s">AXI GP0</text>
  <text x="710" y="168" text-anchor="middle" class="m">0x43C00000</text>

  <!-- PL -->
  <rect x="750" y="60" width="460" height="430" class="pl"/>
  <text x="980" y="86" text-anchor="middle" class="h">PL — 13 × jtag_ctrl</text>
  <text x="980" y="106" text-anchor="middle" class="s">axi_interconnect NUM_MI = 13</text>

  <!-- 12 engines grid -->
  <g>
    <rect x="768" y="120" width="100" height="46" class="bx"/><text x="818" y="140" text-anchor="middle" class="s">jtag0</text><text x="818" y="156" text-anchor="middle" class="m">0x43C00000</text>
    <rect x="876" y="120" width="100" height="46" class="bx"/><text x="926" y="140" text-anchor="middle" class="s">jtag1</text><text x="926" y="156" text-anchor="middle" class="m">0x43C10000</text>
    <rect x="984" y="120" width="100" height="46" class="bx"/><text x="1034" y="140" text-anchor="middle" class="s">jtag2</text><text x="1034" y="156" text-anchor="middle" class="m">0x43C20000</text>
    <rect x="1092" y="120" width="100" height="46" class="bx"/><text x="1142" y="140" text-anchor="middle" class="s">jtag3</text><text x="1142" y="156" text-anchor="middle" class="m">0x43C30000</text>
    <rect x="768" y="174" width="100" height="46" class="bx"/><text x="818" y="194" text-anchor="middle" class="s">jtag4</text><text x="818" y="210" text-anchor="middle" class="m">0x43C40000</text>
    <rect x="876" y="174" width="100" height="46" class="bx"/><text x="926" y="194" text-anchor="middle" class="s">jtag5</text><text x="926" y="210" text-anchor="middle" class="m">0x43C50000</text>
    <rect x="984" y="174" width="100" height="46" class="bx"/><text x="1034" y="194" text-anchor="middle" class="s">jtag6</text><text x="1034" y="210" text-anchor="middle" class="m">0x43C60000</text>
    <rect x="1092" y="174" width="100" height="46" class="bx"/><text x="1142" y="194" text-anchor="middle" class="s">jtag7</text><text x="1142" y="210" text-anchor="middle" class="m">0x43C70000</text>
    <rect x="768" y="228" width="100" height="46" class="bx"/><text x="818" y="248" text-anchor="middle" class="s">jtag8</text><text x="818" y="264" text-anchor="middle" class="m">0x43C80000</text>
    <rect x="876" y="228" width="100" height="46" class="bx"/><text x="926" y="248" text-anchor="middle" class="s">jtag9</text><text x="926" y="264" text-anchor="middle" class="m">0x43C90000</text>
    <rect x="984" y="228" width="100" height="46" class="bx"/><text x="1034" y="248" text-anchor="middle" class="s">jtag10</text><text x="1034" y="264" text-anchor="middle" class="m">0x43CA0000</text>
    <rect x="1092" y="228" width="100" height="46" class="bx"/><text x="1142" y="248" text-anchor="middle" class="s">jtag11</text><text x="1142" y="264" text-anchor="middle" class="m">0x43CB0000</text>
  </g>

  <!-- broadcast engine -->
  <rect x="768" y="292" width="424" height="52" class="bc"/>
  <text x="980" y="312" text-anchor="middle" class="h" fill="#c0392b">★ jtag12 — broadcast-only engine</text>
  <text x="980" y="332" text-anchor="middle" class="m">0x43CC0000 · CTRL bit4 = bcast_en · CTRL[27:16] = mask · CHSEL = TDO source</text>

  <!-- mux -->
  <rect x="768" y="360" width="424" height="56" class="bx" fill="#f0f8ff"/>
  <text x="980" y="381" text-anchor="middle" class="h">jtag_bcast_mux</text>
  <text x="980" y="401" text-anchor="middle" class="m">pin_tck[i] = (bcast_en &amp; mask[i]) ? bc_tck : ch_tck[i]   ×12</text>

  <text x="980" y="440" text-anchor="middle" class="k">broadcast on: selected channels → broadcast engine</text>
  <text x="980" y="460" text-anchor="middle" class="s">not selected / broadcast off → engines independent</text>
  <text x="980" y="480" text-anchor="middle" class="s">bc_tdo = ch_tdo[tdo_sel] (1 of 12)</text>

  <line x1="980" y1="490" x2="980" y2="530" stroke="#39b54a" stroke-width="3"/>
  <text x="992" y="514" class="s">48 pins: TCK/TMS/TDI shared, TDO sep.</text>

  <!-- header -->
  <rect x="730" y="530" width="480" height="96" class="ex"/>
  <text x="970" y="554" text-anchor="middle" class="h">J20 / J21 Expansion Header (48 pin)</text>
  <text x="748" y="576" class="m">jtag1_tck..tdo  …  jtag12_tck..tdo</text>
  <text x="748" y="596" class="s">⚠ 12 sets of TCK/TMS/TDI externally shorted into one group</text>
  <text x="748" y="614" class="s">TDO separate; CHSEL selects the readback lane</text>

  <line x1="970" y1="626" x2="970" y2="666" stroke="#e8873a" stroke-width="3" marker-end="url(#o)"/>

  <!-- targets -->
  <rect x="730" y="666" width="480" height="100" class="ex"/>
  <text x="970" y="690" text-anchor="middle" class="h">External JTAG Chain</text>
  <text x="748" y="714" class="m">AMD Xilinx FPGA chain</text>
  <text x="748" y="734" class="s">TDI → K7 → TDO/TDI → A7 → TDO</text>
  <text x="748" y="754" class="s">single-channel program 91.5 Mbit ≈ 10.27 s @ 10 MHz</text>

  <!-- ports table -->
  <rect x="30" y="430" width="660" height="150" class="bx" fill="#fffdf5"/>
  <text x="48" y="456" class="h">Port Assignment</text>
  <text x="48" y="480" class="m">80</text><text x="110" y="480" class="s">Web console (httpd + 3 CGI scripts)</text>
  <text x="48" y="502" class="m">2542</text><text x="110" y="502" class="s">XVC broadcast → jtag12 (0x43CC0000)</text>
  <text x="48" y="524" class="m">2543</text><text x="110" y="524" class="s">XVC channel 0 → jtag0 (0x43C00000)</text>
  <text x="48" y="546" class="m">…</text>
  <text x="48" y="568" class="m">2554</text><text x="110" y="568" class="s">XVC channel 11 → jtag11 (0x43CB0000)</text>

  <!-- priority -->
  <rect x="30" y="600" width="660" height="166" class="bx" fill="#fdf2f2"/>
  <text x="48" y="626" class="h">Broadcast Priority (top priority)</text>
  <text x="48" y="652" class="s">1. broadcast client connects to 2542</text>
  <text x="48" y="674" class="s">2. server kill_other_clients() scans /proc/*/cmdline</text>
  <text x="48" y="696" class="s">3. drop all single-channel xvcserver_g1 children (parent kept)</text>
  <text x="48" y="718" class="s">4. hardware mux: selected channels switch to broadcast engine</text>
  <text x="48" y="740" class="s">5. broadcast drops → bcast_en=0 → channels independent again</text>
  <text x="48" y="760" class="m" fill="#c0392b">measured: ch3 connect → broadcast connect → ch3 got EOF ✓</text>

  <text x="620" y="830" text-anchor="middle" class="s">AX7Z020B + AC7Z020 · XC7Z020-2CLG400I · 1 GB DDR3 · 256 Mb QSPI</text>
  <text x="620" y="850" text-anchor="middle" class="s">BRAM: 13 engines (12 ch + 1 bcast) × ~1.5K LUT · TCK max 10 MHz (DIV=5)</text>
</svg>
